<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      viewport-fit=cover lets the app paint under the notch; the safe-area
      insets are then reapplied in CSS. user-scalable=no is deliberate: the
      reader implements its own pinch-zoom, and browser zoom on top of it
      fights the gesture handler.
    -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="color-scheme" content="light dark" />
    <title>Comic Reader</title>
    <!--
      The Telegram bridge must exist before React mounts: the app reads
      themeParams during its first render to avoid a flash of the wrong theme.
    -->
    <script src="https://telegram.org/js/telegram-web-app.js?58"></script>
  </head>
  <body>
    <div id="root">
      <!--
        Visible before the JS bundle parses. Replaced as soon as React mounts.
        Without this, a slow tunnel / failed module import looks like a dead white sheet.
      -->
      <div
        id="boot-splash"
        style="
          min-height: 100vh;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          gap: 12px;
          padding: 24px;
          box-sizing: border-box;
          background: #17212b;
          color: #f5f5f5;
          font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
          text-align: center;
        "
      >
        <div
          style="
            width: 36px;
            height: 36px;
            border: 2px solid #708499;
            border-top-color: #5288c1;
            border-radius: 50%;
            animation: boot-spin 0.8s linear infinite;
          "
        ></div>
        <div style="font-size: 16px; font-weight: 600">ComicXreader</div>
        <div id="boot-splash-stage" style="font-size: 13px; color: #708499; max-width: 280px">
          Loading JavaScript bundle…
        </div>
      </div>
      <style>
        @keyframes boot-spin {
          to {
            transform: rotate(360deg);
          }
        }
      </style>
    </div>
    <script>
      // Earliest possible breadcrumb if the module graph fails after this.
      window.__comicBoot = window.__comicBoot || [];
      window.__comicBoot.push({ t: Date.now(), stage: 'html-ready' });
      var stageEl = document.getElementById('boot-splash-stage');
      stageEl.textContent = 'Loading JavaScript bundle…';

      function showBootFailure(message) {
        stageEl.style.color = '#ec3942';
        stageEl.textContent = message;
        if (document.getElementById('boot-reload')) return;
        var btn = document.createElement('button');
        btn.id = 'boot-reload';
        btn.textContent = 'Reload';
        btn.style.cssText =
          'margin-top:8px;padding:10px 18px;border:0;border-radius:10px;background:#5288c1;color:#fff;font-size:14px;font-weight:600';
        btn.onclick = function () {
          location.reload();
        };
        stageEl.parentNode.appendChild(btn);
      }

      window.addEventListener('error', function (event) {
        if (document.getElementById('root')?.dataset?.booted === '1') return;
        showBootFailure('JS error: ' + (event.message || 'module failed to load'));
      });

      // If React never mounts, the splash must not sit forever on "Loading…".
      setTimeout(function () {
        if (document.getElementById('root')?.dataset?.booted === '1') return;
        if (document.getElementById('boot-splash')) {
          showBootFailure(
            'Stuck loading the JS bundle. Check the tunnel/network, then tap Reload.',
          );
        }
      }, 15000);
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
